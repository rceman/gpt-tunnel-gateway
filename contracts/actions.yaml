domains:
    - actions:
        - description: Archive an ADR with exact server-owned CAS.
          input:
            additional_properties: false
            properties:
                key:
                    ref: EntityKeyAndReference
                reason:
                    ref: MutationReason
            required:
                - key
                - reason
            type: object
          metadata:
            annotations:
                destructive: true
                idempotent: true
                open_world: false
                read_only: false
            selector: key
            surface: normal
          name: archive
          output:
            additional_properties: false
            properties:
                key:
                    ref: EntityKeyAndReference
                revision:
                    ref: Revision
            required:
                - key
                - revision
            type: object
        - description: Create one stable revisioned ADR.
          input:
            additional_properties: false
            properties:
                consequences:
                    description: ADR consequences.
                    max_length: 100000
                    min_length: 0
                    type: string
                context:
                    description: ADR context.
                    max_length: 100000
                    min_length: 0
                    type: string
                decision:
                    description: ADR decision.
                    max_length: 100000
                    min_length: 0
                    type: string
                relation_target:
                    description: Canonical target key for the optional initial relation.
                    type: string
                relation_type:
                    enum:
                        - authority
                        - supersedes
                    type: string
                status:
                    enum:
                        - proposed
                    type: string
                summary:
                    description: Bounded ADR summary.
                    max_length: 256
                    min_length: 1
                    type: string
                title:
                    description: ADR title.
                    max_length: 128
                    min_length: 3
                    type: string
            required:
                - title
                - summary
                - context
                - decision
                - consequences
            type: object
          metadata:
            annotations:
                destructive: true
                idempotent: true
                open_world: false
                read_only: false
            selector: none
            surface: normal
          name: create
          output:
            additional_properties: false
            properties:
                key:
                    ref: EntityKeyAndReference
                revision:
                    ref: Revision
            required:
                - key
                - revision
            type: object
        - description: Read the bounded project guide projection for this durable domain.
          input:
            additional_properties: false
            properties: {}
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: false
                read_only: true
            selector: none
            surface: normal
          name: guide
          output:
            additional_properties: false
            properties:
                guidance:
                    max_length: 768
                    min_length: 1
                    type: string
                rule:
                    max_length: 27
                    min_length: 8
                    pattern: '^[A-Z]{3}-RUL([1-9][0-9]{0,14}|[1-8][0-9]{15}|900[0-6][0-9]{12}|90070[0-9]{11}|90071[0-8][0-9]{10}|900719[0-8][0-9]{9}|9007199[0-1][0-9]{8}|90071992[0-4][0-9]{7}|900719925[0-3][0-9]{6}|9007199254[0-6][0-9]{5}|90071992547[0-3][0-9]{4}|9007199254740[0-8][0-9]{2}|90071992547409[0-8][0-9]|9007199254740990|9007199254740991)$'
                    ref: EntityKeyAndReference
                rule_revision:
                    minimum: 1
                    ref: Revision
                source:
                    const: rule
                    type: string
            required:
                - source
                - rule
                - rule_revision
                - guidance
            type: object
        - description: Read bounded ADR revision metadata.
          input:
            additional_properties: false
            properties:
                cursor:
                    ref: CursorAndCompactHandle
                key:
                    ref: EntityKeyAndReference
            required:
                - key
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: false
                read_only: true
            selector: key
            surface: normal
          name: history
          output:
            additional_properties: false
            properties:
                items:
                    items:
                        additional_properties: false
                        properties:
                            actor:
                                type: string
                            changed_fields:
                                items:
                                    type: string
                                type: array
                            mutation_kind:
                                type: string
                            reason:
                                type: string
                            recorded_at:
                                ref: Timestamp
                            revision:
                                ref: Revision
                        required:
                            - revision
                            - mutation_kind
                            - actor
                            - reason
                            - recorded_at
                        type: object
                    type: array
                key:
                    ref: EntityKeyAndReference
            required:
                - key
                - items
            type: object
        - description: List bounded ADR summaries.
          input:
            additional_properties: false
            properties:
                cursor:
                    ref: CursorAndCompactHandle
                include_archived:
                    type: boolean
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: false
                read_only: true
            selector: none
            surface: normal
          name: list
          output:
            additional_properties: false
            properties:
                items:
                    items:
                        additional_properties: false
                        properties:
                            key:
                                ref: EntityKeyAndReference
                            revision:
                                ref: Revision
                            status:
                                enum:
                                    - proposed
                                    - accepted
                                    - superseded
                                    - archived
                                type: string
                            summary:
                                type: string
                            title:
                                type: string
                            updated_at:
                                ref: Timestamp
                        required:
                            - key
                            - title
                            - summary
                            - status
                            - revision
                        type: object
                    type: array
            required:
                - items
            type: object
        - description: Query ADR summaries.
          input:
            additional_properties: false
            properties:
                cursor:
                    ref: CursorAndCompactHandle
                status:
                    enum:
                        - proposed
                        - accepted
                        - superseded
                        - archived
                    type: string
                text:
                    description: Case-insensitive text matched across ADR content.
                    type: string
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: false
                read_only: true
            selector: none
            surface: normal
          name: query
          output:
            additional_properties: false
            properties:
                items:
                    items:
                        additional_properties: false
                        properties:
                            key:
                                ref: EntityKeyAndReference
                            revision:
                                ref: Revision
                            status:
                                enum:
                                    - proposed
                                    - accepted
                                    - superseded
                                    - archived
                                type: string
                            summary:
                                type: string
                            title:
                                type: string
                            updated_at:
                                ref: Timestamp
                        required:
                            - key
                            - title
                            - summary
                            - status
                            - revision
                        type: object
                    type: array
            required:
                - items
            type: object
        - description: Read an ADR revision.
          input:
            additional_properties: false
            properties:
                key:
                    ref: EntityKeyAndReference
                revision:
                    maximum: 1e+06
                    minimum: 1
                    ref: Revision
            required:
                - key
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: true
                read_only: true
            selector: key
            surface: normal
          name: read
          output:
            additional_properties: false
            properties:
                consequences:
                    type: string
                context:
                    type: string
                created_at:
                    ref: Timestamp
                decision:
                    type: string
                key:
                    ref: EntityKeyAndReference
                relations:
                    additional_property_schema:
                        additional_property_schema:
                            type: string
                        type: object
                    type: object
                revision:
                    ref: Revision
                revision_reason:
                    type: string
                status:
                    enum:
                        - proposed
                        - accepted
                        - superseded
                        - archived
                    type: string
                summary:
                    type: string
                title:
                    type: string
                updated_at:
                    ref: Timestamp
            required:
                - key
                - revision
                - title
                - status
                - context
                - decision
                - consequences
                - created_at
                - relations
            type: object
        - description: Update ADR content with exact server-owned CAS.
          input:
            additional_properties: false
            properties:
                consequences:
                    description: ADR consequences.
                    max_length: 100000
                    min_length: 0
                    type: string
                context:
                    description: ADR context.
                    max_length: 100000
                    min_length: 0
                    type: string
                decision:
                    description: ADR decision.
                    max_length: 100000
                    min_length: 0
                    type: string
                key:
                    ref: EntityKeyAndReference
                reason:
                    ref: MutationReason
                status:
                    enum:
                        - proposed
                        - accepted
                        - superseded
                        - archived
                    type: string
                summary:
                    description: Bounded ADR summary.
                    max_length: 256
                    min_length: 1
                    type: string
                title:
                    description: ADR title.
                    max_length: 128
                    min_length: 3
                    type: string
            required:
                - key
                - reason
            type: object
          metadata:
            annotations:
                destructive: true
                idempotent: true
                open_world: false
                read_only: false
            selector: key
            surface: normal
          name: update
          output:
            additional_properties: false
            properties:
                key:
                    ref: EntityKeyAndReference
                revision:
                    ref: Revision
            required:
                - key
                - revision
            type: object
      name: adr
    - actions:
        - description: Wait for a bounded Agent supervision transition.
          input:
            additional_properties: false
            properties:
                key:
                    ref: EntityKeyAndReference
                seconds:
                    default: 50
                    maximum: 600
                    minimum: 1
                    ref: Duration
                    unit: seconds
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: false
                read_only: true
            handler_input:
                - from: key
                  to: agent
            selector: key
            surface: normal
          name: await
          output:
            additional_properties: false
            properties:
                agent:
                    ref: EntityKeyAndReference
                status:
                    enum:
                        - idle
                        - busy
                        - unavailable
                        - disabled
                    type: string
                tail:
                    items:
                        type: string
                    type: array
                tail_truncated:
                    type: boolean
                task:
                    ref: EntityKeyAndReference
            required:
                - agent
                - status
            type: object
        - description: Read the bounded project guide projection for this durable domain.
          input:
            additional_properties: false
            properties: {}
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: false
                read_only: true
            selector: none
            surface: normal
          name: guide
          output:
            one_of:
                - additional_properties: false
                  properties:
                    architecture:
                        max_length: 768
                        min_length: 1
                        type: string
                    authority:
                        max_length: 768
                        min_length: 1
                        type: string
                    canonical_state:
                        max_length: 768
                        min_length: 1
                        type: string
                    checkpoints:
                        max_length: 768
                        min_length: 1
                        type: string
                    cli_usage:
                        max_length: 768
                        min_length: 1
                        type: string
                    delegation:
                        max_length: 768
                        min_length: 1
                        type: string
                    execution_example:
                        max_length: 768
                        min_length: 1
                        type: string
                    exploration_budget:
                        max_length: 768
                        min_length: 1
                        type: string
                    prompt_interrupt:
                        max_length: 768
                        min_length: 1
                        type: string
                    role_authority:
                        max_length: 768
                        min_length: 1
                        type: string
                    source:
                        const: builtin
                        type: string
                    startup:
                        max_length: 768
                        min_length: 1
                        type: string
                    status_await:
                        max_length: 768
                        min_length: 1
                        type: string
                    stop_fast:
                        max_length: 768
                        min_length: 1
                        type: string
                    tail:
                        max_length: 768
                        min_length: 1
                        type: string
                    testing:
                        max_length: 768
                        min_length: 1
                        type: string
                  required:
                    - source
                    - role_authority
                    - delegation
                    - startup
                    - canonical_state
                    - exploration_budget
                    - stop_fast
                    - checkpoints
                    - testing
                    - execution_example
                    - cli_usage
                    - architecture
                    - tail
                    - status_await
                    - prompt_interrupt
                    - authority
                  type: object
                - additional_properties: false
                  properties:
                    architecture:
                        max_length: 768
                        min_length: 1
                        type: string
                    authority:
                        max_length: 768
                        min_length: 1
                        type: string
                    canonical_state:
                        max_length: 768
                        min_length: 1
                        type: string
                    checkpoints:
                        max_length: 768
                        min_length: 1
                        type: string
                    cli_usage:
                        max_length: 768
                        min_length: 1
                        type: string
                    delegation:
                        max_length: 768
                        min_length: 1
                        type: string
                    execution_example:
                        max_length: 768
                        min_length: 1
                        type: string
                    exploration_budget:
                        max_length: 768
                        min_length: 1
                        type: string
                    prompt_interrupt:
                        max_length: 768
                        min_length: 1
                        type: string
                    role_authority:
                        max_length: 768
                        min_length: 1
                        type: string
                    rule:
                        max_length: 27
                        min_length: 8
                        pattern: '^[A-Z]{3}-RUL([1-9][0-9]{0,14}|[1-8][0-9]{15}|900[0-6][0-9]{12}|90070[0-9]{11}|90071[0-8][0-9]{10}|900719[0-8][0-9]{9}|9007199[0-1][0-9]{8}|90071992[0-4][0-9]{7}|900719925[0-3][0-9]{6}|9007199254[0-6][0-9]{5}|90071992547[0-3][0-9]{4}|9007199254740[0-8][0-9]{2}|90071992547409[0-8][0-9]|9007199254740990|9007199254740991)$'
                        ref: EntityKeyAndReference
                    rule_revision:
                        minimum: 1
                        ref: Revision
                    source:
                        const: rule
                        type: string
                    startup:
                        max_length: 768
                        min_length: 1
                        type: string
                    status_await:
                        max_length: 768
                        min_length: 1
                        type: string
                    stop_fast:
                        max_length: 768
                        min_length: 1
                        type: string
                    tail:
                        max_length: 768
                        min_length: 1
                        type: string
                    testing:
                        max_length: 768
                        min_length: 1
                        type: string
                  required:
                    - source
                    - rule
                    - rule_revision
                    - role_authority
                    - delegation
                    - startup
                    - canonical_state
                    - exploration_budget
                    - stop_fast
                    - checkpoints
                    - testing
                    - execution_example
                    - cli_usage
                    - architecture
                    - tail
                    - status_await
                    - prompt_interrupt
                    - authority
                  type: object
        - description: Interrupt the current Agent turn and optionally submit a replacement message.
          input:
            additional_properties: false
            properties:
                key:
                    ref: EntityKeyAndReference
                message:
                    max_length: 4096
                    min_length: 1
                    type: string
            type: object
          metadata:
            annotations:
                destructive: true
                idempotent: true
                open_world: false
                read_only: false
            handler_input:
                - from: key
                  to: agent
            selector: key
            surface: normal
          name: interrupt
          output:
            additional_properties: false
            properties:
                operation:
                    ref: EntityKeyAndReference
                status:
                    type: string
            required:
                - operation
                - status
            type: object
        - description: List the project-bound Agents in deterministic key order.
          input:
            additional_properties: false
            properties: {}
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: false
                read_only: true
            selector: none
            surface: normal
          name: list
          output:
            additional_properties: false
            properties:
                agents:
                    items:
                        additional_properties: false
                        properties:
                            enabled:
                                type: boolean
                            key:
                                ref: EntityKeyAndReference
                            role:
                                type: string
                        required:
                            - key
                            - role
                            - enabled
                        type: object
                    type: array
            required:
                - agents
            type: object
        - description: Send one bounded prompt to the server-selected Agent.
          input:
            additional_properties: false
            properties:
                key:
                    ref: EntityKeyAndReference
                message:
                    max_length: 4096
                    min_length: 1
                    type: string
            required:
                - message
            type: object
          metadata:
            annotations:
                destructive: true
                idempotent: false
                open_world: false
                read_only: false
            handler_input:
                - from: key
                  to: agent
            selector: key
            surface: normal
          name: prompt
          output:
            additional_properties: false
            properties:
                operation:
                    ref: EntityKeyAndReference
                status:
                    type: string
            required:
                - operation
                - status
            type: object
        - description: Read the compact current status of one server-selected Agent.
          input:
            additional_properties: false
            properties:
                key:
                    ref: EntityKeyAndReference
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: false
                read_only: true
            handler_input:
                - from: key
                  to: agent
            selector: key
            surface: normal
          name: status
          output:
            additional_properties: false
            properties:
                agent:
                    ref: EntityKeyAndReference
                status:
                    enum:
                        - idle
                        - busy
                        - unavailable
                        - disabled
                    type: string
                task:
                    ref: EntityKeyAndReference
            required:
                - agent
                - status
            type: object
        - description: Read a bounded transcript window from a server-selected logical Agent.
          input:
            additional_properties: false
            properties:
                key:
                    ref: EntityKeyAndReference
                lines:
                    default: 30
                    description: Maximum transcript lines to return.
                    maximum: 200
                    minimum: 1
                    type: integer
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: false
                read_only: true
            handler_input:
                - from: key
                  to: agent
            selector: key
            surface: normal
          name: tail
          output:
            additional_properties: false
            properties:
                agent:
                    ref: EntityKeyAndReference
                lines:
                    items:
                        type: string
                    type: array
                truncated:
                    type: boolean
            required:
                - agent
                - lines
            type: object
      name: agent
    - actions:
        - description: List the bounded project callback events supported by Gateway.
          input:
            additional_properties: false
            properties: {}
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: false
                read_only: true
            selector: none
            surface: normal
          name: events
          output:
            additional_properties: false
            properties:
                events:
                    items:
                        additional_properties: false
                        properties:
                            description:
                                type: string
                            key:
                                ref: EntityKeyAndReference
                        required:
                            - key
                            - description
                        type: object
                    type: array
            required:
                - events
            type: object
        - description: List deterministic compact callback registrations for the bound project.
          input:
            additional_properties: false
            properties: {}
            type: object
          metadata:
            annotations:
                destructive: false
                idempotent: true
                open_world: false
                read_only: true
            selector: none
            surface: normal
          name: list
          output:
            additional_properties: false
            properties:
                callbacks:
                    items:
                        additional_properties: false
                        properties:
                            event:
                                type: string
                            key:
                                ref: EntityKeyAndReference
                            script:
                                additional_properties: false
                                properties:
                                    path:
                                        type: string
                                required:
                                    - path
                                type: object
                            url:
                                additional_properties: false
                                properties:
                                    method:
                                        enum:
                                            - POST
                                            - PUT
                                        type: string
                                    url:
                                        type: string
                                required:
                                    - method
                                    - url
                                type: object
                        required:
                            - key
                            - event
                        type: object
                    type: array
            required:
                - callbacks
            type: object
        - description: Register one bounded project callback for an Agent work-finished event.
          input:
            additional_properties: false
            any_of:
                - additional_properties: false
                  properties:
                    callback:
                        ref: EntityKeyAndReference
                    event:
                        enum:
                            - agent.work_finished
                        type: string
                    script:
                        additional_properties: false
                        properties:
                            args:
                                items:
                                    description: One bounded script argument.
                                    max_length: 256
                                    type: string
                                max_items: 16
                                type: array
                            path:
                                description: Repository-relative callback script path.
                                max_length: 4096
                                min_length: 1
                                type: string
                        required:
                            - path
                            - args
                        type: object
                    url:
                        additional_properties: false
                        properties:
                            body:
                                description: Exact callback request body.
                                max_length: 16384
                                type: string
                            method:
                                enum:
                                    - POST
                                    - PUT
                                type: string
                            url:
                                description: Absolute HTTP or HTTPS callback URL.
                                max_length: 2048
                                min_length: 1
                                type: string
                        required:
                            - method
                            - url
                            - body
                        type: object
                  required:
                    - callback
                    - event
                    - url
                  type: object
                - additional_properties: false
                  properties:
                    callback:
                        ref: EntityKeyAndReference
                    event:
                        enum:
                            - agent.work_finished
                        type: string
                    script:
                        additional_properties: false
                        properties:
                            args:
                                items:
                                    description: One bounded script argument.
                                    max_length: 256
                                    type: string
                                max_items: 16
                                type: array
                            path:
                                description: Repository-relative callback script path.
                                max_length: 4096
                                min_length: 1
                                type: string
                        required:
                            - path
                            - args
                        type: object
                    url:
                        additional_properties: false
                        properties:
                            body:
                                description: Exact callback request body.
                                max_length: 16384
                                type: string
                            method:
                                enum:
                                    - POST
                                    - PUT
                                type: string
                            url:
                                description: Absolute HTTP or HTTPS callback URL.
                                max_length: 2048
                                min_length: 1
                                type: string
                        required:
                            - method
                            - url
                            - body
                        type: object
                  required:
                    - callback
                    - event
                    - script
                  type: object
            properties:
                callback:
                    ref: EntityKeyAndReference
                event:
                    enum:
                        - agent.work_finished
                    type: string
                script:
                    additional_properties: false
                    properties:
                        args:
                            items:
                                description: One bounded script argument.
                                max_length: 256
                                type: string
                            max_items: 16
                            type: array
                        path:
                            description: Repository-relative callback script path.
                            max_length: 4096
                            min_length: 1
                            type: string
                    required:
                        - path
                        - args
                    type: object
                url:
                    additional_properties: false
                    properties:
                        body:
                            description: Exact callback request body.
                            max_length: 16384
                            type: string
                        method:
                            enum:
                                - POST
                                - PUT
                            type: string
                        url:
                            description: Absolute HTTP or HTTPS callback URL.
                            max_length: 2048
                            min_length: 1
                            type: string
                    required:
                        - method
                        - url
                        - body
                    type: object
            required:
                - callback
                - event
            type: object
          metadata:
            annotations:
                destructive: true
                idempotent: true
                open_world: false
                read_only: false
            selector: none
            surface: normal
          name: register
          output:
            additional_properties: false
            properties:
                event:
                    type: string
                key:
                    ref: EntityKeyAndReference
                status:
                    enum:
                        - registered
                        - already_registered
                        - removed
                    type: string
            required:
                - key
                - event
                - status
            type: object
        - description: Remove one exact project callback registration.
          input:
            additional_properties: false
            properties:
                key:
                    ref: EntityKeyAndReference
            required:
                - key
            type: object
          metadata:
            annotations:
                destructive: true
                idempotent: true
                open_world: false
                read_only: false
            handler_input:
                - from: key
                  to: callback
            selector: key
            surface: normal
