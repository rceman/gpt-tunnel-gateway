name: CI
on:
  push:
    branches:
      - main
    tags:
      - "v*"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: bash scripts/check-go-format.sh HEAD^
      - run: go vet ./...
      - run: go test -race ./...
      - run: python3 scripts/static-check.py
      - run: bash scripts/build-release.sh
      - run: cd dist && sha256sum -c SHA256SUMS && ! grep -Eq "  /" SHA256SUMS
      - run: git diff --check
